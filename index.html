<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Maze 3D - Research Environment</title>
    <meta name="description" content="3D Maze with Fire Simulation and Eye Tracking" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <!-- Fix favicon 404 error -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" media="screen" href="assets/css/style.css" />
    <!-- WebGazer.js -->
    <script src="webgazer.js" type="text/javascript"></script>
    <style>
        /* Overlays and Essential Styles */
        #calibration-overlay, #transition-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color, #1a1a1a);
            z-index: 9999;
            font-family: 'Segoe UI', sans-serif;
            opacity: 0.98;
            text-align: center;
            color: white;
        }
        #transition-screen { flex-direction: column; justify-content: center; align-items: center; display: none; }
        .calib-instructions { position: absolute; top: 10%; width: 100%; text-align: center; color: var(--text-color); }
        #webgazerVideoFeed, #webgazerVideoCanvas, #webgazerFaceOverlay, #webgazerFaceFeedbackBox {
            display: block !important; visibility: visible !important;
        }

        /* --- NEW SETUP SCREEN STYLES (Matching image_0.png) --- */
        :root {
            --setup-bg-dark: #0a1124;
            --setup-card-bg: #ffffff;
            --setup-text-dark: #1a233a;
            --setup-text-gray: #6b7280;
            --setup-blue-btn: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            --setup-border-radius: 16px;
        }

        /* Ensure box-sizing for custom layout */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        #setup-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Approximating the dark blue circuit background with a gradient */
            background: radial-gradient(circle at center, #1a2a55 0%, #02071a 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .setup-box {
            background: var(--setup-card-bg);
            padding: 40px;
            border-radius: var(--setup-border-radius);
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            position: relative;
            color: var(--setup-text-dark);
        }

        .setup-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            color: var(--setup-text-gray);
        }

        .setup-box h1 {
            margin: 0 0 30px 0;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--setup-text-dark);
            letter-spacing: 0.025em;
        }

        /* Custom Input Style */
        .input-group { margin-bottom: 30px; }
        .setup-box input#user-id {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            color: var(--setup-text-dark);
            transition: border-color 0.2s;
            background: #fff;
            text-align: left;
        }
        .setup-box input#user-id:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .setup-box input::placeholder { color: #9ca3af; }

        /* Theme Select Buttons */
        .theme-select {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            border: none;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f3f4f6;
            color: var(--setup-text-gray);
        }
        .theme-toggle-btn svg { width: 18px; height: 18px; }
        
        /* Active state for theme buttons */
        .theme-toggle-btn.active.day-btn {
            background: #fff;
            color: #f59e0b;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .theme-toggle-btn.active.night-btn {
            background: #111827;
            color: #fff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        /* Divider */
        .setup-divider {
            height: 1px;
            background: #e5e7eb;
            border: none;
            margin: 0 0 30px 0;
        }

        /* Start Button Section */
        .start-section { margin-bottom: 30px; }
        .setup-btn-main {
            width: 100%;
            padding: 16px;
            background: var(--setup-blue-btn);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
            margin-bottom: 12px;
        }
        .setup-btn-main:hover { transform: translateY(-1px); box-shadow: 0 12px 20px -3px rgba(59, 130, 246, 0.5); }
        .setup-btn-main:active { transform: translateY(1px); }

        .setup-description {
            display: block;
            font-size: 0.8rem;
            color: var(--setup-text-gray);
        }

        /* Static Progress Stepper */
        .setup-progress {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .setup-progress .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #e5e7eb;
            border: 2px solid transparent;
        }
        .setup-progress .connector {
            width: 20px; height: 2px;
            background: #e5e7eb;
        }
        .setup-progress .dot.active {
            background: #fff;
            border-color: #3b82f6;
        }
        .setup-progress .connector.active {
            background: #3b82f6;
        }

        /* Loading indicator for WebGazer initialization */
        .loading-indicator {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 8px;
            color: var(--setup-text-dark);
        }
        .loading-indicator.show {
            display: block;
        }
        .loading-indicator .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #3b82f6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
  </head>
  <body class="theme-night">
    <!-- MODIFIED SETUP SCREEN -->
    <div id="setup-screen">
        <div class="setup-box">
            <button class="setup-close-btn" aria-label="Close">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            
            <h1>EXPERIMENT SETUP</h1>

            <div class="input-group">
                <input type="text" id="user-id" placeholder="Enter ID (1-4)" />
            </div>

            <div class="theme-select">
                <button class="theme-toggle-btn day-btn" onclick="setTheme('day')">
                    <svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
                    DAY MODE
                </button>
                <button class="theme-toggle-btn night-btn active" onclick="setTheme('night')">
                    <svg fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
                    NIGHT MODE
                </button>
            </div>

            <hr class="setup-divider">

            <div class="start-section">
                <button class="setup-btn-main" onclick="initiateStudy()">BEGIN EXPERIMENT</button>
                <span class="setup-description">Includes calibration and maze tasks</span>
            </div>
            
            <!-- Loading indicator -->
            <div id="loading-indicator" class="loading-indicator">
                <span class="spinner"></span>
                <span id="loading-text">Initializing...</span>
            </div>

            <div class="setup-progress">
                <div class="dot active"></div>
                <div class="connector active"></div>
                <div class="dot"></div>
                <div class="connector"></div>
                <div class="dot"></div>
                <div class="connector"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>
    <!-- END MODIFIED SETUP SCREEN -->


    <div id="transition-screen">
        <h2 id="transition-title" style="font-size: 2.5rem; margin-bottom: 1rem;">STAGE COMPLETE</h2>
        <p id="transition-msg" style="font-size: 1.2rem; margin-bottom: 2rem;">Ready for the next segment?</p>
        <button class="setup-btn" style="max-width: 300px;" onclick="resumeNextSegment()">CONTINUE TO NEXT TASK</button>
    </div>

    <div id="calibration-overlay">
        <div class="calib-instructions">
            <h2 id="calib-title" style="font-size: clamp(1.2rem, 3vw, 2rem);">EYE TRACKING CALIBRATION</h2>
            <p id="calib-instruction" style="font-weight: bold; color: #2ecc71; font-size: 1.2rem;">Please move your mouse to the GREEN DOT and click it 5 times.</p>
            <p id="calib-status">Progress: 0/9 dots</p>
        </div>
    </div>
    
    <div id="ui-layer">
        <div id="hud-left" class="hud-panel">
            <div class="webcam-container">
                <div id="webgazer-target"></div>
                <div class="scanner-overlay"></div>
            </div>
        </div>

        <div id="hud-top">
            <div id="phase-indicator" style="color: #00f0ff; font-weight: bold; padding: 10px; font-family: monospace;"></div>
            <button class="hud-btn" onclick="togglePanel('hud-left')" title="Toggle Gaze Feed">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
            <button id="btn-toggle-map" class="hud-btn" onclick="togglePanel('hud-right')" title="Toggle Map">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
            </button>
            <button class="hud-btn warning" id="btn-export" onclick="downloadMazeData()" title="Emergency Data Export">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </button>
        </div>

        <div id="hud-right" class="hud-panel">
            <div id="minimap-container">
                <canvas id="minimap"></canvas>
                <canvas id="objects"></canvas>
            </div>
        </div>
    </div>

    <div id="canvasContainer"></div>

    <audio id="bumpSound">
      <source src="assets/sound/bat.mp3" />
    </audio>

    <script src="assets/js/three.min.js"></script>
    <script src="assets/js/Demonixis.Input.js"></script>
    <script src="assets/js/Demonixis.Minimap.js"></script>
    <script src="assets/js/Demonixis.GameHelper.js"></script>
    <script src="assets/js/maze3d.js"></script>

    <script>
      // =====================================================
      // [修复] 不在这里初始化 WebGazer！
      // WebGazer 的初始化完全由 maze3d.js 中的 initWebGazer() 负责
      // 这样可以避免重复初始化导致的 "t is not a function" 错误
      // =====================================================

      // Modified setTheme to handle visual button states
      function setTheme(t) {
        document.body.className = 'theme-' + t;
        localStorage.setItem('user-theme', t);

        const dayBtn = document.querySelector('.day-btn');
        const nightBtn = document.querySelector('.night-btn');
        if (dayBtn && nightBtn) {
            dayBtn.classList.toggle('active', t === 'day');
            nightBtn.classList.toggle('active', t === 'night');
        }
      }

      function togglePanel(pId) {
        var p = document.getElementById(pId);
        if (p) {
            var isHidden = (window.getComputedStyle(p).opacity === '0');
            p.style.opacity = isHidden ? '1' : '0';
            p.style.pointerEvents = isHidden ? 'auto' : 'none';
        }
      }

      // Show/hide loading indicator
      function showLoading(show, text) {
        const indicator = document.getElementById('loading-indicator');
        const loadingText = document.getElementById('loading-text');
        if (indicator) {
            indicator.classList.toggle('show', show);
            if (text && loadingText) {
                loadingText.textContent = text;
            }
        }
      }

      // Initialize on page load - only set theme, DON'T init WebGazer
      window.onload = function() {
          console.log('Page loaded');
          
          // Set theme
          const saved = localStorage.getItem('user-theme') || 'night';
          setTheme(saved);
          
          // WebGazer will be initialized in maze3d.js when calibration starts
          console.log('WebGazer will initialize during calibration phase');
      };
    </script>
  </body>
</html>
